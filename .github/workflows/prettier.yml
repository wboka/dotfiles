name: autofix.ci

on:
  pull_request:
  push:

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn format

      - uses: autofix-ci/action@v1
        with:
          commit-message: "Apply Prettier format"
